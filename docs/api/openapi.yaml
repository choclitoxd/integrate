  /api/v1/admin/experiences:
    get:
      tags: [Admin]
      operationId: listExperiencesForModeration
      summary: Experiencias por estado (cola de revisión con status=PENDING_REVIEW).
      security: [{ bearerAuth: [] }]
      x-required-roles: [ROLE_ADMIN]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ExperienceStatus' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
