openapi: 3.1.0
info:
  title: Intégrate API
  version: 1.0.0
  summary: Contrato REST del núcleo transaccional de Intégrate (turismo comunitario offline-first).
  description: |
    Contrato de los endpoints críticos de autenticación, disponibilidad, bloqueo pesimista de aforo,
    webhook de pasarela y sincronización offline por lotes.

    **Convenciones**
    - Timestamps en UTC, ISO-8601 con sufijo `Z`. Fechas locales (`LocalDate`) en zona `America/Bogota`.
    - Montos en pesos colombianos (COP) como `integer` `int64`, sin centavos.
    - Todo error se emite como `application/problem+json` (RFC 9457). Los errores de protocolo usan
      `type: about:blank`; los de dominio usan `https://api.integrate.co/problems/<slug>`.
    - Roles en el claim `roles` del JWT: `ROLE_TOURIST`, `ROLE_HOST`, `ROLE_LINK_MANAGER`, `ROLE_ADMIN`.
    - Cada respuesta incluye la cabecera `X-Trace-Id`, igual al `traceId` de los errores.
servers:
  - url: https://api.integrate.co
    description: Producción
  - url: http://localhost:8080
    description: Desarrollo local (Docker Compose)

tags:
  - name: Auth
    description: Autenticación, sesiones, autorregistro, consentimientos y registro asistido (RF-01, RF-02, RF-03, RF-06).
  - name: Catalog
    description: Consulta pública de disponibilidad (RF-04).
  - name: Gestor
    description: Operaciones del Gestor de Enlace — subida de documentos, anfitriones de su jurisdicción y activación asistida (RF-03, ADR-0007).
  - name: Host
    description: Panel del anfitrión — propuestas y franjas (RF-05, ADR-0006).
  - name: Admin
    description: Asociaciones, alta de anfitriones, acreditación de gestores y moderación del catálogo (RF-03, RF-07, RF-08, ADR-0006, ADR-0007).
  - name: Booking
    description: Bloqueo pesimista de aforo con TTL de 15 minutos (RF-09, RF-10).
  - name: Payments
    description: Webhooks de pasarela con firma HMAC e idempotencia (RF-12, RNF-06).
  - name: Offline
    description: Sincronización por lotes de validaciones de campo (RF-17, RF-18, RNF-06).

paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Autentica con email y contraseña.
      description: |
        Emite un access token JWT RS256 (900 s) en el cuerpo y un refresh token rotativo (7 días) en una
        cookie `HttpOnly; Secure; SameSite=Strict` con `Path=/api/v1/auth`.
        Tras 5 intentos fallidos consecutivos en menos de 10 minutos, la cuenta se bloquea 15 minutos (423).
        Si el usuario no ha aceptado la versión vigente de la política de datos, responde 200 con
        `requiresConsentUpdate = true`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example:
              email: turista@ejemplo.com
              password: Password123!
      responses:
        '200':
          description: Autenticación exitosa.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenResponse' }
              examples:
                consentimientoAlDia:
                  value:
                    accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6ImF1dGgtMjAyNi0xMCIsInR5cCI6IkpXVCJ9...
                    tokenType: Bearer
                    expiresIn: 900
                    user:
                      id: d3b07384-d113-4c9f-bb9b-734e56599b1a
                      email: turista@ejemplo.com
                      fullName: Carlos Restrepo
                      roles: [ROLE_TOURIST]
                    requiresConsentUpdate: false
                    pendingPolicyVersion: null
                    pendingPurposes: []
                requiereReconsentimiento:
                  value:
                    accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6ImF1dGgtMjAyNi0xMCIsInR5cCI6IkpXVCJ9...
                    tokenType: Bearer
                    expiresIn: 900
                    user:
                      id: 0f1e2d3c-4b5a-4968-8776-655443322110
                      email: anfitrion@comunidad.integrate.co
                      fullName: Rosa Patiño
                      roles: [ROLE_HOST, ROLE_TOURIST]
                    requiresConsentUpdate: true
                    pendingPolicyVersion: v2.0
                    pendingPurposes: [PERSONAL_DATA, SENSITIVE_VICTIM]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/AccountSuspended' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '423': { $ref: '#/components/responses/AccountLocked' }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rota el refresh token y emite un nuevo access token.
      description: |
        Endpoint complementario de la rotación obligatoria (Refresh Token Rotation). El token presentado
        se revoca y se registra su `replaced_by_id`. No lleva body.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Sesión renovada.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenResponse' }
        '401': { $ref: '#/components/responses/RefreshTokenInvalid' }
        '403': { $ref: '#/components/responses/AccountSuspended' }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerTourist
      summary: Autorregistro de un turista con consentimiento Habeas Data (RF-01, RF-02, ADR-0005 §6).
      description: |
        Crea siempre un usuario con rol `TOURIST`: el cuerpo no admite rol (los anfitriones entran por
        `register-assisted` y los gestores y administradores por asignación). El consentimiento se registra
        con `channel = SELF_SERVICE`, la IP y el user agent de la petición. `consent.purposes` debe incluir
        `PERSONAL_DATA` y `consent.policyVersion` debe ser la versión vigente; si no, 422.
        No inicia sesión: el cliente llama después a `/api/v1/auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example:
              email: turista@ejemplo.com
              password: PasswordSegura123*
              fullName: Carlos Restrepo
              docType: CC
              docNumber: '1094857483'
              phone: '+573001234567'
              consent:
                policyVersion: v1.0
                purposes: [PERSONAL_DATA, HEALTH_EMERGENCY]
      responses:
        '201':
          description: Turista registrado.
          headers:
            Location:
              description: URI del usuario creado.
              schema: { type: string, format: uri-reference }
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
              example:
                userId: d3b07384-d113-4c9f-bb9b-734e56599b1a
                email: turista@ejemplo.com
                roles: [ROLE_TOURIST]
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/UserAlreadyExists' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Cierra la sesión del refresh token presentado (ADR-0005 §6).
      description: |
        Revoca el refresh token de la cookie con `revoke_reason = LOGOUT` y la borra. Idempotente: sin
        cookie o con un token inválido también responde 204. El access token vigente expira por sí solo (≤ 900 s).
      security:
        - refreshCookie: []
        - {}
      responses:
        '204':
          description: Sesión cerrada.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'

  /api/v1/me/consents:
    get:
      tags: [Auth]
      operationId: getMyConsents
      summary: Estado de consentimiento del titular frente a la política vigente (RF-02, ADR-0005 §6).
      description: |
        Una entrada por finalidad aplicable a los roles del titular (`SENSITIVE_VICTIM` solo con `ROLE_HOST`).
        La PWA lo consulta antes de reservar para pedir `HEALTH_EMERGENCY` en lugar de recibir un 428.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estado actual.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentStatusResponse' }
              example:
                currentPolicyVersion: v1.0
                consents:
                  - purpose: PERSONAL_DATA
                    state: VALID
                    policyVersion: v1.0
                    occurredAt: '2026-10-05T14:02:11Z'
                  - purpose: HEALTH_EMERGENCY
                    state: MISSING
                    policyVersion: null
                    occurredAt: null
                requiresConsentUpdate: false
                pendingPurposes: []
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Auth]
      operationId: grantMyConsents
      summary: Otorga finalidades sobre la política vigente (RF-02, ADR-0005 §6).
      description: |
        Inserta un acto `GRANTED` / `SELF_SERVICE` por finalidad (tabla append-only). Idempotente: las finalidades
        ya vigentes no generan un acto nuevo. 422 si la versión no es la vigente o una finalidad no aplica a los
        roles del titular. La revocación (`REVOKED`) se implementará en la Fase 4.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentAcceptance' }
            example:
              policyVersion: v1.0
              purposes: [HEALTH_EMERGENCY]
      responses:
        '200':
          description: Estado resultante.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentStatusResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/privacy-policies/current:
    get:
      tags: [Auth]
      operationId: getCurrentPrivacyPolicy
      summary: Política de tratamiento de datos vigente (Ley 1581 art. 9, ADR-0013 §1).
      description: |
        Pública. El registro exige `consent.policyVersion` igual a esta versión, y el titular debe poder leer el
        documento antes de aceptarlo (autorización previa, expresa e informada). Cambia solo por migración, por eso
        se puede cachear 5 minutos.
      security: []
      responses:
        '200':
          description: Política vigente.
          headers:
            Cache-Control:
              description: '`max-age=300, public`.'
              schema: { type: string }
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyPolicy' }
              example:
                version: v1.0
                title: Política de Tratamiento de Datos Personales de Intégrate
                documentUrl: https://integrate.co/legal/politica-datos-v1.0.pdf
                effectiveFrom: '2026-10-01T05:00:00Z'
                contentSha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        '404': { $ref: '#/components/responses/PrivacyPolicyNotPublished' }

  /api/v1/auth/register-assisted:
    post:
      tags: [Auth]
      operationId: registerAssistedHost
      summary: Registra un Anfitrión Comunitario por intermediación del Gestor de Enlace.
      description: |
        Solo `ROLE_LINK_MANAGER` con acreditación `ACTIVE` (si no, 403 `ENROLLMENT_MANAGER_NOT_ACTIVE`) y `ROLE_ADMIN`.
        Crea siempre un usuario con rol `HOST` en la asociación del gestor (ADR-0007 §3).
        - Si no se envía `email`, el servidor genera uno sintético `h-<10 caracteres>@comunidad.integrate.co` (opaco, sin relación con el documento; ADR-0038 §1)
          en minúsculas (`cc1094857483@…` para CC).
        - La contraseña inicial es un secreto aleatorio que no se revela. La cuenta queda con
          `credentialStatus = PENDING_RESET` hasta que el anfitrión la active con el código que emite el gestor
          (`/api/v1/gestor/hosts/{hostProfileId}/activation-code` → `/api/v1/auth/activate`).
        - Con `victimCondition = false` no se admiten RUV, hecho victimizante ni soporte (422).
        - Las llaves S3 deben venir de `/api/v1/gestor/uploads` con el tipo correcto, el objeto debe existir, ser PDF
          de hasta 5 MB y no estar ya usado; si no, 422 `ENROLLMENT_DOCUMENT_INVALID`.
        - Los datos de víctima se cifran con AES-256-GCM antes de persistir.
        - El consentimiento se registra con `channel = ASSISTED_PROXY`, `captured_by` = el usuario invocador
          y la IP y el user agent de la terminal del Gestor. Exige el formato físico firmado en S3 y las
          finalidades `PERSONAL_DATA` y `SENSITIVE_VICTIM`.
        - Crea la vinculación en `host_manager_assignments` (`valid_from = NOW()`) con el Gestor autenticado
          o, si invoca un `ADMIN`, con el `linkManagerId` indicado (422 si falta, 404 si no existe, 409 si no está `ACTIVE`).
      security:
        - bearerAuth: []
      x-required-roles: [ROLE_LINK_MANAGER, ROLE_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistedHostRegistrationRequest' }
            example:
              fullName: Rosa Patiño
              docType: CC
              docNumber: '1094857483'
              phone: '+573001234567'
              victimData:
                victimCondition: true
                ruvRegistrationNumber: RUV-2019-000123
                victimizationType: DESPLAZAMIENTO_FORZADO
                supportDocS3Key: host-support/2026/10/0f1e2d3c.pdf
              consent:
                policyVersion: v1.0
                purposes: [PERSONAL_DATA, SENSITIVE_VICTIM]
                physicalConsentFormS3Key: consents/physical/2026/10/0f1e2d3c.pdf
      responses:
        '201':
          description: Anfitrión registrado y vinculado al Gestor.
          headers:
            Location:
              description: URI del usuario creado.
              schema: { type: string, format: uri-reference }
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistedHostRegistrationResponse' }
              example:
                userId: 0f1e2d3c-4b5a-4968-8776-655443322110
                hostProfileId: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
                associationId: 11111111-2222-4333-8444-555555555555
                assignmentId: 4821
                linkManagerId: 99999999-8888-4777-8666-555555555555
                email: h-k7q3m9x2tw@comunidad.integrate.co
                emailIsSynthetic: true
                roles: [ROLE_HOST]
                credentialStatus: PENDING_RESET
                consent:
                  channel: ASSISTED_PROXY
                  policyVersion: v1.0
                  purposes: [PERSONAL_DATA, SENSITIVE_VICTIM]
                  capturedBy: 99999999-8888-4777-8666-555555555555
                  capturedAt: '2026-10-05T14:02:11Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EnrollmentForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/UserAlreadyExists' }
        '422': { $ref: '#/components/responses/DocumentInvalid' }

  /api/v1/auth/activate:
    post:
      tags: [Auth]
      operationId: activateAssistedAccount
      summary: Activa la cuenta de un anfitrión registrado por un gestor con un código de un solo uso (ADR-0007 §6).
      description: |
        Canjea el código que el gestor entregó al anfitrión por una contraseña propia: la cuenta pasa de
        `PENDING_RESET` a `ACTIVE` y el anfitrión inicia sesión después con `/api/v1/auth/login`.
        El código tolera minúsculas, guiones y espacios. Correo inexistente, código erróneo, vencido (72 h),
        consumido o con 5 intentos fallidos responden el mismo 401 `AUTH_ACTIVATION_INVALID`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivationRequest' }
            example:
              email: h-k7q3m9x2tw@comunidad.integrate.co
              code: 7K3QD-M9X2P
              newPassword: una-clave-larga-y-propia
      responses:
        '204':
          description: Cuenta activada.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ActivationInvalid' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Solicita un enlace de restablecimiento de contraseña por correo (ADR-0014 §1).
      description: |
        Responde **202 sin cuerpo siempre**, exista o no la cuenta, para no revelar qué correos están registrados.
        Si la cuenta es activa, con correo real y no superó 3 solicitudes en la última hora, emite un token de
        un solo uso (15 min, revoca el anterior) y encola en la misma transacción el correo con el enlace
        `{FRONTEND_BASE_URL}/restablecer-contrasena#token=<token>`. El token viaja en el fragmento: nunca llega
        al servidor. Las cuentas con correo sintético recuperan el acceso con un código de su gestor.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
            example:
              email: carlos@ejemplo.com
      responses:
        '202':
          description: Solicitud recibida (misma respuesta exista o no la cuenta).
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Restablece la contraseña con el token del enlace recibido por correo (ADR-0014 §4).
      description: |
        Deja la cuenta `ACTIVE` y sin bloqueo, consume el token, revoca su código de activación vivo y **todos**
        sus refresh tokens (`PASSWORD_CHANGE`) y encola el aviso `PASSWORD_CHANGED`. No inicia sesión: el
        cliente vuelve a `/api/v1/auth/login`. Token inexistente, vencido, usado, reemplazado o de una cuenta no
        apta responden el mismo 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
            example:
              token: 3q2-7wEXAMPLEtokenEXAMPLEtokenEXAMPLEtok_w
              newPassword: una-clave-larga-y-propia
      responses:
        '204':
          description: Contraseña restablecida y sesiones revocadas.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ResetTokenInvalid' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/gestor/uploads:
    post:
      tags: [Gestor]
      operationId: presignEnrollmentDocument
      summary: URL prefirmada para subir un PDF del enrolamiento directamente a S3 (ADR-0007 §5).
      description: |
        El servidor genera la llave (`consents/physical/{yyyy}/{MM}/{uuid}.pdf` o `host-support/…`), sin datos
        personales. El cliente hace `PUT uploadUrl` con `Content-Type: application/pdf` antes de `expiresAt`
        (5 minutos) y luego envía `s3Key` en `register-assisted`, que verifica el objeto (existe, es PDF, ≤ 5 MB).
      security: [{ bearerAuth: [] }]
      x-required-roles: [ROLE_LINK_MANAGER, ROLE_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentUploadRequest' }
      responses:
        '201':
          description: URL de subida emitida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentUploadResponse' }
              example:
                s3Key: consents/physical/2026/10/0f1e2d3c-4b5a-4968-8776-655443322110.pdf
                uploadUrl: https://integrate-sensitive.s3.amazonaws.com/consents/physical/2026/10/0f1e2d3c-4b5a-4968-8776-655443322110.pdf?X-Amz-Signature=...
                contentType: application/pdf
                maxSizeBytes: 5242880
                expiresAt: '2026-10-07T14:07:11Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EnrollmentForbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/gestor/hosts:
    get:
      tags: [Gestor]
      operationId: listManagedHosts
      summary: Anfitriones bajo la jurisdicción vigente del gestor autenticado (ADR-0007 §1).
      description: Solo datos de contacto; el documento se muestra con sus 4 últimos caracteres y nunca hay datos de víctima.
      security: [{ bearerAuth: [] }]
      x-required-roles: [ROLE_LINK_MANAGER]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de anfitriones.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ManagedHost' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EnrollmentForbidden' }

  /api/v1/gestor/hosts/{hostProfileId}/activation-code:
    post:
      tags: [Gestor]
      operationId: issueActivationCode
      summary: Emite el código de activación de un anfitrión de la jurisdicción del gestor (ADR-0007 §6).
      description: |
        Código de 10 caracteres en base32 de Crockford (`XXXXX-XXXXX`) que vence a las 72 h; solo se guarda su
        SHA-256 y se muestra una única vez. Emitir uno nuevo revoca el anterior. Un anfitrión fuera de la
        jurisdicción vigente responde 404; una cuenta ya activa con correo real, 409 (recupera por correo). Una
        cuenta activa con correo sintético sí recibe código: es su forma de recuperar el acceso (ADR-0014 §4).
      security: [{ bearerAuth: [] }]
      x-required-roles: [ROLE_LINK_MANAGER]
      parameters:
        - name: hostProfileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Código emitido.
          headers:
            Cache-Control:
              description: Siempre `no-store`.
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivationCode' }
              example:
                code: 7K3QD-M9X2P
                expiresAt: '2026-10-10T14:02:11Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EnrollmentForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidStatusTransition' }

  /api/v1/experiences:
    get:
      tags: [Catalog]
      operationId: searchExperiences
      summary: Catálogo público paginado de experiencias aprobadas (RF-04, ADR-0006 §6).
      description: |
        Solo experiencias `APPROVED`. Nunca expone datos del anfitrión: la oferta se identifica por la
        asociación comunitaria y el municipio (R-05). Si llega `dateFrom`, `dateTo` o `minSlots`, solo se listan
        experiencias con al menos una franja `OPEN` futura en el rango (por defecto los próximos 60 días) y
        `minSlots` cupos (por defecto 1). Orden fijo: más recientes primero.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - { name: departmentCode, in: query, schema: { type: string, pattern: '^[0-9]{2}$' } }
        - { name: municipalityCode, in: query, schema: { type: string, pattern: '^[0-9]{5}$' } }
        - { name: category, in: query, schema: { type: string, pattern: '^[A-Z_]{3,40}$' } }
        - { name: intensity, in: query, schema: { $ref: '#/components/schemas/PhysicalIntensity' } }
        - { name: q, in: query, description: Texto contenido en el título (sin distinguir mayúsculas)., schema: { type: string, maxLength: 100 } }
        - { name: dateFrom, in: query, schema: { type: string, format: date } }
        - { name: dateTo, in: query, description: '≥ dateFrom y a máximo 60 días.', schema: { type: string, format: date } }
        - { name: minSlots, in: query, schema: { type: integer, minimum: 1, maximum: 30 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de experiencias.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ExperienceSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

