name: Quality checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Maven verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # actions/setup-java v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-api/pom.xml

      - name: Verify backend
        working-directory: backend-api
        run: ./mvnw --batch-mode --no-transfer-progress verify

  pwa:
    name: PWA · ${{ matrix.check }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-pwa
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, lint, format:check, test, build]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.check }}
        run: npm run "${{ matrix.check }}"
