# Perfil de pruebas de integración (PostgresIntegrationTest). Las credenciales y la llave JWT
# se inyectan en tiempo de ejecución con @DynamicPropertySource: nada sensible aquí (SEC-DIR-004).
spring:
  flyway:
    # Misma política v0.1 de desarrollo que el perfil dev (ADR-0005 §8).
    locations: classpath:db/migration,classpath:db/seed-dev

integrate:
  booking:
    expiration:
      # Las pruebas invocan el worker de expiración directamente, con el reloj de prueba (ADR-0008 §9).
      enabled: false

  voucher:
    sweep:
      # Las pruebas invocan el barrido directamente (ADR-0010 §10).
      enabled: false

logging:
  level:
    com.integrate: INFO
    org.testcontainers: WARN
