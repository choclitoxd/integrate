# =============================================================================
# Intégrate · Configuración base (todos los entornos) — ADR-0002 §4
# SEC-DIR-004: ninguna credencial aquí. Las variables sin valor por defecto
# son obligatorias: si faltan, el arranque aborta (fail-fast, §4).
# =============================================================================
spring:
  application:
    name: integrate-backend-api

  # --- Runtime: rol integrate_api (solo DML) --------------------------------
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: integrate-api-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: 2
      # Esperar conexión menos que statement_timeout (15s) del rol integrate_api.
      connection-timeout: 5000
      validation-timeout: 2000
      idle-timeout: 300000
      max-lifetime: 1800000
      # lock_timeout (2s), statement_timeout (15s) e idle_in_transaction (30s)
      # se fijan a nivel de rol en infra/postgres/init/00_bootstrap.sql.

  # --- Migraciones: rol integrate_owner (DDL) -------------------------------
  flyway:
    enabled: true
    url: ${DATABASE_URL}
    user: ${FLYWAY_USER}
    password: ${FLYWAY_PASSWORD}
    locations: classpath:db/migration
    # V1 crea los 9 esquemas (common + 8 de negocio); el historial vive en common.
    default-schema: common
    schemas: common,auth,catalog,booking,payments,voucher,offline,audit,notification
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false

  # --- Correo SMTP (ADR-0011 §4): Mailpit en local; Gmail SMTP con contraseña de aplicación o un relé en
  #     producción. Host y puerto sin default (fail-fast); credenciales opcionales (Mailpit no las pide).
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  # --- JPA / Hibernate --------------------------------------------------------
  jpa:
    open-in-view: false
    hibernate:
      # Flyway es el único dueño del esquema; Hibernate solo valida.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

integrate:
  # --- Sesión (ADR-0005 §2): llave RSA ≥ 2048 PKCS#8 PEM en Base64; sin default (fail-fast)
  jwt:
    signing-key: ${JWT_SIGNING_KEY}
    key-id: ${JWT_SIGNING_KEY_ID}
  # --- CORS de la PWA (ADR-0005 §9): orígenes separados por coma; vacío = sin CORS
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # --- Primer ADMIN (ADR-0005 §9): inactivo si faltan correo o contraseña
  bootstrap:
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Administrador de plataforma}
      doc-type: ${BOOTSTRAP_ADMIN_DOC_TYPE:PA}
      doc-number: ${BOOTSTRAP_ADMIN_DOC_NUMBER:ADMIN0001}
      phone: ${BOOTSTRAP_ADMIN_PHONE:+10000000000}
  # --- Datos sensibles (ADR-0007 §4): AES-256 de 32 bytes en Base64 por versión; sin default (fail-fast)
  crypto:
    sensitive:
      current-version: ${SENSITIVE_DATA_KEY_CURRENT_VERSION:1}
      keys:
        1: ${SENSITIVE_DATA_KEY_V1}
  # --- Documentos sensibles en S3 (ADR-0007 §5): endpoint y credenciales estáticas solo en local
  #     (LocalStack); vacías = cadena por defecto del SDK (rol IAM en despliegue).
  storage:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_ENDPOINT_URL:}
    sensitive-bucket: ${AWS_S3_SENSITIVE_BUCKET_NAME}
    # Vouchers PDF (ADR-0010 §7): bucket privado propio, sin default (fail-fast).
    voucher-bucket: ${AWS_S3_BUCKET_NAME}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  # --- Reservas (ADR-0008 §8): TTL del bloqueo, ventana de idempotencia y worker de expiración (RF-11)
  booking:
    hold-ttl: PT15M
    idempotency-window: PT24H
    expiration:
      enabled: true
      interval: PT60S
      batch-size: 100
  # --- Pagos (ADR-0009 §7): proveedor activo sin default (fail-fast); cada adaptador se activa solo con sus secretos.
  payments:
    provider: ${PAYMENT_PROVIDER}
    mock:
      webhook-secret: ${PAYMENT_WEBHOOK_SECRET_MOCK:}
      signature-tolerance: PT5M
    wompi:
      public-key: ${WOMPI_PUBLIC_KEY:}
      integrity-secret: ${WOMPI_INTEGRITY_SECRET:}
      events-secret: ${WOMPI_EVENTS_SECRET:}
      # Solo durante una rotación del secreto de eventos (ADR-0009 §4).
      events-secret-previous: ${WOMPI_EVENTS_SECRET_PREVIOUS:}
      # Cubre los reintentos de Wompi (30 min, 3 h y 24 h) con margen.
      max-event-age: PT25H
  # --- Vouchers (ADR-0010 §9): llave RSA propia (PKCS#8 PEM en Base64, >= 2048 bits) sin default (fail-fast).
  voucher:
    signing-key: ${VOUCHER_SIGNING_KEY}
    signing-key-id: ${VOUCHER_SIGNING_KEY_ID}
    validity-after-end: PT24H
    download-url-ttl: PT5M
    sweep:
      enabled: true
      interval: PT60S
      batch-size: 50
    executor:
      core: 2
      max: 4
      queue: 200
  # --- Notificaciones (ADR-0011 §3, §7): remitente obligatorio y despachador del outbox.
  notification:
    mail-from: ${MAIL_FROM}
    dispatch:
      enabled: true
      interval: PT15S
      batch-size: 20
      stale-after: PT10M
    backoff:
      initial: PT1M
      max: PT6H

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

logging:
  # traceId publicado en el MDC por TraceIdFilter (ADR-0003); se inserta en el patrón por defecto.
  pattern:
    correlation: "[%X{traceId:-}] "
  level:
    root: INFO
