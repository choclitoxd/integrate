<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comprobante de dispersión</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f4;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f4;">
    <tr>
      <td align="center" style="padding:16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
               style="max-width:480px;background:#ffffff;border-radius:8px;">
          <tr>
            <td style="padding:20px 20px 8px 20px;">
              <p style="margin:0;font-size:13px;color:#14532d;font-weight:bold;">Intégrate</p>
              <h1 style="margin:8px 0 0 0;font-size:20px;line-height:26px;color:#14532d;">Dispersión pagada</h1>
              <p style="margin:12px 0 0 0;font-size:15px;line-height:22px;">
                Hola, <span th:text="${associationName}">asociación</span>. Pagamos la dispersión del
                <span th:text="${paidDate}">fecha</span>. Adjuntamos el comprobante contable en PDF.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:12px 20px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                     style="font-size:15px;line-height:22px;border-top:1px solid #e3e8e3;">
                <tr><td style="padding:8px 0 0 0;">Pagos incluidos</td>
                    <td align="right" style="padding:8px 0 0 0;" th:text="${paymentCount}">1</td></tr>
                <tr><td style="padding:8px 0 0 0;">Valor bruto cobrado</td>
                    <td align="right" style="padding:8px 0 0 0;" th:text="${grossAmount}">$ 0</td></tr>
                <tr><td style="padding:8px 0 0 0;">Comisión de la plataforma</td>
                    <td align="right" style="padding:8px 0 0 0;" th:text="${platformFee}">$ 0</td></tr>
                <tr><td style="padding:8px 0 0 0;font-weight:bold;">Desembolso neto a la comunidad</td>
                    <td align="right" style="padding:8px 0 0 0;font-weight:bold;" th:text="${netAmount}">$ 0</td></tr>
              </table>
              <p style="margin:12px 0 0 0;font-size:12px;color:#555555;">
                Referencia del lote: <span th:text="${batchId}">lote</span>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
